# Fiche d'identité du projet : nom, version, dépendances, réglages des outils.

[project]
name = "rattachement-adresses-postes"
version = "0.1.0"
description = "Rattache chaque adresse de la BAN au poste HTA/BT Enedis le plus proche."
authors = [{ name = "Ludovic Ravenach" }]
requires-python = ">=3.10"
dependencies = [  # bibliothèques ajoutées au fil des étapes
    "requests",  # étape 2 : téléchargement des données
    "pandas",  # étape 3 : lecture et exploration des tableaux
    "pandera",  # étape 3 : contrôle de la qualité des données
    "geopandas",  # étape 5 : calcul spatial (poste le plus proche)
    "pyarrow",  # étape 6 : enregistrement des résultats au format Parquet
    "matplotlib",  # étape 9 : graphique des distances et carte
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipykernel"]  # outils de travail : tests, style, notebooks
spark = ["pyspark>=3.5"]  # étape 8 : calcul avec Spark (demande aussi Java 17 ou plus)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rattachement"]  # où se trouve le code

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Règles vérifiées : erreurs (F), style de base (E4, E7, E9), imports bien triés (I).
# Les écrire ici évite qu'elles changent d'une version de ruff à l'autre.
select = ["E4", "E7", "E9", "F", "I"]
